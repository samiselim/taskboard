name: Release

# Publishing a GitHub Release (e.g. v1.2.0) deploys that version:
#   backend  -> the image ALREADY BUILT for that commit gets the tag v1.2.0, then a PR
#               updates deploy/helm/taskboard/values-prod.yaml; merging it = Argo CD deploys
#   frontend -> built with the version, uploaded to S3, CloudFront cache cleared (after approval)
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote-backend:
    name: Promote backend image + open GitOps PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the release branch
      pull-requests: write  # open the PR
      id-token: write       # AWS (OIDC)
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the PR targets main

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Tag the existing image with the release version (build once, deploy many)
        env:
          REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          REPOSITORY="${REPOSITORY_URL#*/}"     # 123.dkr.ecr.eu-west-1.amazonaws.com/taskboard-backend -> taskboard-backend
          SOURCE_TAG="sha-${GITHUB_SHA::7}"     # GITHUB_SHA = the commit the release tag points to
          IMAGE=$(aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageTag="$SOURCE_TAG" \
                  --query 'images[0].[imageManifest,imageManifestMediaType]' --output json)
          if [ "$(echo "$IMAGE" | jq -r '.[0]')" = "null" ]; then
            echo "::error::No image $SOURCE_TAG in ECR. Wait for the Backend workflow on main to finish for this commit."
            exit 1
          fi
          aws ecr put-image --repository-name "$REPOSITORY" --image-tag "$VERSION" \
            --image-manifest "$(echo "$IMAGE" | jq -r '.[0]')" \
            --image-manifest-media-type "$(echo "$IMAGE" | jq -r '.[1]')"
          echo "### 🏷️ $REPOSITORY:$SOURCE_TAG is now also tagged $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the deployment Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="deploy/backend-$VERSION"
          yq -i ".backend.image.tag = \"$VERSION\"" deploy/helm/taskboard/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "deploy(prod): backend $VERSION"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "deploy(prod): backend $VERSION" \
            --body "Deploys backend **$VERSION** to production. Merge this PR and Argo CD syncs the cluster. Release: ${{ github.event.release.html_url }}"

  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    needs: promote-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production # requires approval; shows up in the repo's Deployments page
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7 # the release commit

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ github.event.release.tag_name }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          # Hashed assets never change: cache them for a year
          aws s3 sync out/_next/static "s3://$BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (HTML...) must always be revalidated
          aws s3 sync out/ "s3://$BUCKET/" --delete --exclude "_next/static/*" \
            --cache-control "no-cache"

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
          echo "### 🌐 Frontend ${{ github.event.release.tag_name }} deployed to ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"
