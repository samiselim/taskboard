name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"
      - ".github/actions/**"
  push:
    branches: [main] # every commit on main gets an image, so any commit can be released
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # Gitleaks lists the commits of the pull request

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-scan:
    name: Test & pre-build scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube uses the Git history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 .

      - name: Unit tests (with coverage for SonarQube)
        run: pytest --cov=taskboard --cov-report=xml --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: app/backend/reports/

      - name: Pre-build scan
        uses: ./.github/actions/pre-build-scan
        with:
          working-directory: app/backend
          report-name: backend-pre-build-scan
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-organization: ${{ vars.SONAR_ORGANIZATION }}

  build:
    name: Build, post-build scan & push
    needs: test-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OpenID Connect: log in to AWS without stored keys
    steps:
      - uses: actions/checkout@v7

      - name: Compute the image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build the image
        working-directory: app/backend
        # --pull: always start from the latest (patched) base image
        run: docker build --pull --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} -t taskboard-backend:${{ steps.meta.outputs.tag }} .

      - name: Post-build scan
        uses: ./.github/actions/post-build-scan
        with:
          scan-type: image
          target: taskboard-backend:${{ steps.meta.outputs.tag }}
          report-name: backend-post-build-scan

      # ---- only on main: publish the image (it is DEPLOYED later, by a release)
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the image to ECR
        if: github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag "taskboard-backend:$TAG" "$REPOSITORY:$TAG"
          docker push "$REPOSITORY:$TAG"
          echo "### 🐳 Pushed \`$REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
