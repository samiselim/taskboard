# Production values (EKS), used by gitops/applications/taskboard-prod.yaml.
# Fill the CHANGE_ME values with the Terraform outputs (see PROJECT.md, Phase B3).
# backend.image.tag is updated by the release workflow through a Pull Request:
# merging it makes Argo CD redeploy the backend.

backend:
  image:
    repository: CHANGE_ME.dkr.ecr.eu-west-1.amazonaws.com/taskboard-backend   # terraform output ecr_repository_url
    tag: "v0.0.0"
    pullPolicy: IfNotPresent
  replicas: 2
  environment: production

database:
  storage:
    size: 10Gi
    storageClassName: ""    # the cluster's default: EBS gp3 (created by the EBS CSI add-on)

secret:
  create: false

externalSecret:
  enabled: true
  region: eu-west-1
  remoteKey: taskboard/prod/database          # terraform output db_secret_name

targetGroupBinding:
  enabled: true
  targetGroupARN: CHANGE_ME                   # terraform output backend_target_group_arn
