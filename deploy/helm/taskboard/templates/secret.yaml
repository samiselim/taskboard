{{- if and .Values.secret.create (not .Values.externalSecret.enabled) }}
# LOCAL ONLY: never commit real passwords in values files. On EKS, use externalSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.secret.username | quote }}
  password: {{ .Values.secret.password | quote }}
{{- end }}
