{{- if .Values.externalSecret.enabled }}
# Where to read secrets from: AWS Secrets Manager. The External Secrets Operator
# authenticates with EKS Pod Identity (set up by Terraform), so no keys are stored here.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "taskboard.fullname" . }}-aws
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
---
# What to read: copies username/password from Secrets Manager into a Kubernetes Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "taskboard.fullname" . }}-aws
  target:
    name: {{ include "taskboard.secretName" . }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: password
{{- end }}
